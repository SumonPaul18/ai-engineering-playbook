# .github/workflows/test-automation.yml
name: Test Automation Scripts & Labs

on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'labs/**'
      - 'Makefile'
      - '.github/workflows/test-automation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - 'labs/**'
      - 'Makefile'

jobs:
  test-scripts:
    name: Validate Automation Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Shellcheck automation scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './automation'
          
      - name: Lint Python scripts
        run: |
          pip install flake8
          find automation/ -name "*.py" -exec flake8 {} \;
          
      - name: Run prompt assembler validation
        run: make prompts-validate
        
      - name: Verify Makefile targets exist
        run: |
          make help | grep -q "prompts-validate" || exit 1
          make help | grep -q "automation-setup" || exit 1
          make help | grep -q "labs-test" || exit 1

  test-labs:
    name: Run Lab Integration Tests
    runs-on: ubuntu-latest
    needs: test-scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install lab dependencies
        run: |
          pip install jinja2 pyyaml pytest
          
      - name: Execute lab tests
        run: make labs-test
        
      - name: Generate test report
        if: always()
        run: |
          echo "## Lab Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY